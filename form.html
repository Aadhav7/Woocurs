<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entry Form</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 420px; margin: 40px auto; padding: 0 16px; }
    label { display: block; margin-top: 14px; font-weight: bold; }
    input { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
    .error { color: #b00020; font-size: 0.9em; margin-top: 4px; min-height: 0; }
    button { margin-top: 20px; padding: 10px 18px; cursor: pointer; }
  </style>
</head>
<body>

  <h2>Entry Form</h2>

  <!-- novalidate turns off the browser's own pop-ups so our JavaScript messages show instead -->
  <form method="POST" action="form.php" onsubmit="return validateForm()" novalidate>

    <label for="name">Name</label>
    <input type="text" id="name" name="name" maxlength="100">
    <div class="error" id="nameError"></div>

    <label for="email">Email</label>
    <input type="email" id="email" name="email" maxlength="100">
    <div class="error" id="emailError"></div>

    <label for="phone">Phone (10 digits)</label>
    <input type="text" id="phone" name="phone" maxlength="10" inputmode="numeric">
    <div class="error" id="phoneError"></div>

    <button type="submit">Submit</button>
  </form>

  <script>
    function showError(id, message) {
      document.getElementById(id).textContent = message;
    }

    // Client-side check (fast feedback). form.php checks the same rules again on the server.
    function validateForm() {
      let valid = true;

      const name  = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const phone = document.getElementById("phone").value.trim();

      showError("nameError", "");
      showError("emailError", "");
      showError("phoneError", "");

      if (name === "") {
        showError("nameError", "Name is required.");
        valid = false;
      }

      if (email === "") {
        showError("emailError", "Email is required.");
        valid = false;
      } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        showError("emailError", "Please enter a valid email address.");
        valid = false;
      }

      if (phone === "") {
        showError("phoneError", "Phone is required.");
        valid = false;
      } else if (!/^\d{10}$/.test(phone)) {
        showError("phoneError", "Phone must be exactly 10 digits.");
        valid = false;
      }

      return valid;
    }
  </script>

</body>
</html>
